[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
markers =
    tier1: Tier 1 happy-path feature coverage Playwright E2E tests
    tier2: Tier 2 boundary, invalid-input, error-recovery, and security E2E tests
    tier3: Tier 3 pairwise cross-feature Playwright E2E flows
    tier4: Tier 4 real-world end-to-end study scenarios
    eval: Automated Zero-Hallucination AI Grounding Evaluation Suite
    mock: Tests specific to mock mode
    live: Tests specific to live mode (skipped when E2E_MODE != live)
    allow_pageerror: Allow uncaught browser pageerror events for intentional fault tests
    allow_console_error: Allow browser console error messages for intentional network/fault tests
